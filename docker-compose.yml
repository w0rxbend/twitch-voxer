# One-command deployment: `docker compose up -d --build`
#
# Requires a `.env` file next to this compose file (copy .env.example).
# TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET and TWITCH_BOT_USERNAME are needed
# (the bot refuses to start without all three) — on the first
# `docker compose up` the bot logs an authorization URL; open it once in a
# browser to sign in with the bot account.  The resulting tokens are saved
# under ./data and survive restarts, so this is a one-time step.
#
# Before the FIRST `docker compose up`, create the state directory yourself:
#   mkdir -p data
# If Docker creates it instead, it is owned by root and the container user
# (UID 1000) cannot write tokens or databases into it.
# All secrets come from `.env` via `env_file`; the `environment` block below
# only overrides container paths and bind addresses.
#
# To only build the image (tagged twitch-voxer:latest) without starting it:
#   docker compose build
#
# Multi-architecture (amd64 + arm64) builds — one-time setup on an x86_64 host:
#   docker run --privileged --rm tonistiigi/binfmt --install arm64
#   docker buildx create --name multiarch --driver docker-container
# Then build both architectures (add --push to publish to a registry):
#   docker buildx bake --builder multiarch
# Or build just the arm64 image and load it into the local Docker store:
#   docker buildx build --platform linux/arm64 -t twitch-voxer:arm64 --load .
services:
  voxer:
    image: twitch-voxer:latest
    build:
      context: .
      # Used by `docker buildx bake` for multi-arch builds; plain
      # `docker compose build` still builds only the host architecture.
      platforms:
        - linux/amd64
        - linux/arm64
    # Run a tiny init process as PID 1 so signals are forwarded and zombie
    # processes are reaped.
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 45s
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=256m
    ports:
      - "127.0.0.1:8080:8080"
      # One-time OAuth callback used on first start: the bot prints a URL,
      # you open it once, tokens are saved to ./data.  Register
      # http://localhost:4343/oauth/callback as the redirect URL in the
      # Twitch dev console (https://dev.twitch.tv/console/apps).
      - "127.0.0.1:4343:4343"
    env_file: .env
    environment:
      VOXER_DB_PATH: /data/voices.json
      VOXER_TIMESTAMPS_DB_PATH: /data/timestamps.json
      VOXER_MESSAGES_PATH: /data/messages.json
      VOXER_AUDIO_DIR: /data/audio
      VOXER_SERVER_HOST: "0.0.0.0"
      VOXER_SERVER_PORT: "8080"
      VOXER_OVERLAY_TOKEN: ${VOXER_OVERLAY_TOKEN:?Set a random VOXER_OVERLAY_TOKEN of at least 32 URL-safe characters in .env}
      # Bind the OAuth callback server on all interfaces so the published
      # 4343 port above can reach it.
      VOXER_OAUTH_HOST: "0.0.0.0"
      VOXER_TOKEN_FILE: /data/tokens.json
    volumes:
      # Persistent state: voice assignments, timestamps, scheduled messages,
      # generated audio — and now also the OAuth tokens (tokens.json)
      - ./data:/data
      # The image bundles default voice styles and emote sounds; uncomment
      # to override them with your local copies instead.  Note: the emote
      # image cache (emotes/emotes.db) is NOT baked into the image — generate
      # it on the host with `uv run voxer-fetch-emotes` and uncomment the
      # emotes mount if you want emote images in the overlay.
      # - ./voices:/app/voices:ro
      # - ./emotes:/app/emotes:ro
      # Supertonic model cache — survives rebuilds so the ~100 MB model is
      # downloaded only once
      - tts-cache:/home/voxer/.cache
    restart: unless-stopped

volumes:
  tts-cache:
