<!DOCTYPE html>
<html lang="en">
<head>
  <title>Voxer — Full Overlay</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: dark;
      --cyan: #55e6ff;
      --pink: #ff4fd8;
      --amber: #ffd166;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: transparent;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }

    #visualizer {
      position: fixed;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.985);
      transition: opacity 360ms ease, transform 520ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    #visualizer.visible {
      opacity: 1;
      transform: scale(1);
    }

    #stage-3d {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #glitch-stage,
    #energy-field,
    #scanlines {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(56vw, 620px);
      height: min(56vh, 500px);
      transform: translate(-50%, -50%);
    }

    #stage-3d canvas,
    #glitch-stage canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #energy-field {
      background:
        radial-gradient(circle at 50% 48%, rgba(85, 230, 255, 0.42), transparent 15%),
        radial-gradient(circle at 52% 48%, rgba(255, 79, 216, 0.34), transparent 24%),
        radial-gradient(circle at 50% 55%, rgba(255, 209, 102, 0.18), transparent 30%);
      mix-blend-mode: screen;
      opacity: 0;
      border-radius: 50%;
      filter: blur(18px) saturate(1.45);
      transform: translate(-50%, -50%) scale(0.42);
      transition: opacity 260ms ease;
    }

    #visualizer.visible #energy-field {
      opacity: 0.82;
      animation: energy-breathe 900ms ease-in-out infinite alternate;
    }

    #scanlines {
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.08) 0,
          rgba(255, 255, 255, 0.08) 1px,
          transparent 1px,
          transparent 7px
        );
      mix-blend-mode: overlay;
      opacity: 0;
    }

    #visualizer.visible #scanlines {
      opacity: 0.26;
      animation: scan-drift 720ms steps(8) infinite;
    }

    #np-card {
      position: fixed;
      right: 28px;
      bottom: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: min(480px, calc(100vw - 32px));
      padding: 10px 20px 10px 10px;
      color: #fff;
      background: rgba(12, 17, 26, 0.62);
      backdrop-filter: blur(14px) saturate(1.3);
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.38),
        0 0 32px rgba(85, 230, 255, 0.18);
      opacity: 0;
      pointer-events: none;
      z-index: 30;
    }

    #np-card.visible {
      opacity: 1;
      animation: np-enter 250ms cubic-bezier(0.2, 0.9, 0.2, 1) both;
    }

    #np-card.leaving {
      animation: np-exit 250ms ease both;
    }

    @keyframes np-enter {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes np-exit {
      from {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      to {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
      }
    }

    #np-card .np-avatar {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 14px rgba(85, 230, 255, 0.42);
    }

    #np-card .np-username {
      min-width: 0;
      overflow: hidden;
      font-size: 18px;
      font-weight: 750;
      line-height: 1.2;
      text-overflow: ellipsis;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.72);
      white-space: nowrap;
    }

    #np-card .np-emotes {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow: hidden;
      flex-shrink: 0;
    }

    #np-card .np-emotes img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    #status-pill {
      position: fixed;
      top: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      font-size: 12px;
      color: #dfe8f2;
      background: rgba(12, 17, 26, 0.62);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      pointer-events: none;
      z-index: 40;
    }

    #status-pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff5f6d;
    }

    #status-pill .dot[data-state="connected"] {
      background: #4be38a;
      box-shadow: 0 0 8px rgba(75, 227, 138, 0.7);
    }

    #status-pill .dot[data-state="reconnecting"] {
      background: var(--amber);
    }

    #autoplay-hint {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
      background: rgba(5, 8, 12, 0.55);
      z-index: 100;
      cursor: pointer;
    }

    #autoplay-hint.visible {
      display: flex;
    }

    @keyframes energy-breathe {
      from {
        filter: blur(18px) saturate(1.25) hue-rotate(0deg);
        transform: translate(-50%, -50%) scale(0.42) rotate(-2deg);
      }

      to {
        filter: blur(24px) saturate(1.8) hue-rotate(24deg);
        transform: translate(-50%, -50%) scale(0.58) rotate(2deg);
      }
    }

    @keyframes scan-drift {
      to {
        transform: translate(-50%, calc(-50% + 14px));
      }
    }

    #emote-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 20;
    }

    .emote-particle {
      position: absolute;
      object-fit: contain;
      image-rendering: auto;
      transform-origin: center center;
      will-change: transform, opacity;
      animation: emote-fly var(--dur) var(--ease) var(--delay) both;
    }

    @keyframes emote-fly {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.25) rotate(var(--r0));
      }

      14% {
        opacity: 1;
        transform: translate(calc(var(--tx) * 0.08), calc(var(--ty) * 0.08)) scale(1.2) rotate(calc(var(--r0) + 8deg));
      }

      80% {
        opacity: 0.88;
      }

      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0.55) rotate(var(--r1));
      }
    }

    @media (max-width: 560px) {
      #glitch-stage,
      #energy-field,
      #scanlines {
        width: min(78vw, 420px);
        height: min(54vh, 380px);
      }

      #np-card {
        right: 16px;
        bottom: 16px;
        max-width: calc(100vw - 32px);
        padding-right: 16px;
      }

      #np-card .np-username {
        font-size: 16px;
      }
    }
  </style>
  <link rel="stylesheet" href="/static/overlay.css">
</head>
<body>
<div id="visualizer" aria-hidden="true">
  <div id="energy-field"></div>
  <div id="stage-3d"></div>
  <div id="glitch-stage"></div>
  <div id="scanlines"></div>
</div>

<div id="emote-layer" aria-hidden="true"></div>

<div id="np-card" role="status" aria-live="polite" aria-atomic="true" aria-hidden="true">
  <img class="np-avatar" src="/static/speaker.svg" alt="" width="44" height="44">
  <span class="np-username"></span>
  <span class="np-emotes"></span>
</div>

<div id="status-pill" role="status" aria-live="polite" aria-atomic="true">
  <span class="dot" aria-hidden="true"></span>
  <span class="txt">disconnected</span>
</div>

<button id="autoplay-hint" type="button">Enable Audio</button>

<script src="/static/vendor/pixi.min.js"></script>
<script src="/static/vendor/pixi-unsafe-eval.min.js"></script>
<script src="/static/overlay.js"></script>
<script type="module" src="/static/full.js"></script>
</body>
</html>
