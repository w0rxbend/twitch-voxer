[project]
name = "twitch-voxer"
version = "0.1.0"
description = "Twitch chat TTS bot with per-user voice assignment and browser overlay"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langdetect>=1.0.9",
    "pickledb>=1.6",
    "python-dotenv>=1.1.1",
    "requests>=2.32",
    "starlette>=1.0.0",
    "twitchio>=3.2.2",
    "supertonic>=1.2.3",
    "uvicorn[standard]>=0.47.0",
    "colorlog>=6.10.1",
    "emoji>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voxer"]

[project.scripts]
twitch-voxer       = "voxer.app:main"
voxer-fetch-emotes = "voxer.fetch_emotes:main"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include           = ["voxer", "main.py"]
pythonVersion     = "3.14"
typeCheckingMode  = "standard"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pyright>=1.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
